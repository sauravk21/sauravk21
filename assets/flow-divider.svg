<svg xmlns="http://www.w3.org/2000/svg" width="960" height="32" viewBox="0 0 960 32" fill="none">
  <defs><linearGradient id="line"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".3" stop-color="#22d3ee"/><stop offset=".7" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>
  <style>
    .flow { stroke-dasharray: 100 860; animation: flow 7s linear infinite; }
